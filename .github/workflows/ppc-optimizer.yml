name: PPC Optimizer - Daily Run (with Dayparting)

on:
  schedule:
    - cron: '0 9 * * *'          # Every day at 5:00 AM Eastern Time (9:00 AM UTC)
  workflow_dispatch:             # Allows you to run it manually anytime

jobs:
  optimize:
    runs-on: ubuntu-latest

    env:
      AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
      AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
      AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
      AMAZON_PROFILE_ID: ${{ secrets.AMAZON_PROFILE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pandas requests

      - name: Run PPC Optimizer (LIVE)
        run: python optimize_campaigns.py
        env:
          DRY_RUN: "false"           # ← Change to "true" only when testing

      - name: Upload daily campaign plan
        uses: actions/upload-artifact@v4
        with:
          name: daily-campaign-plan
          path: campaign_plan_*.json
