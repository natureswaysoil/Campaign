name: Production safety tests
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DAILY_OPTIMIZER_TOKEN: secret-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q test_automation.py test_production_safety.py test_acos_bid_circuit_breaker.py test_amazon_bid_recommendations.py test_ppc_agent.py test_production_routes.py test_sales_growth_engine.py test_review_regressions.py
