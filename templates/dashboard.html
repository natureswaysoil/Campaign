<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Ads Campaign Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-gray-900">Amazon Ads Campaign Manager</h1>
                <p class="text-gray-600">Natures Way Soil • Active Campaigns Only</p>
            </div>
            <button onclick="runOptimizer()" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-2xl font-semibold text-lg shadow-lg">
                ▶️ Run Daily Optimizer Now
            </button>
        </div>

        <!-- Summary -->
        <div id="summary" class="bg-white rounded-3xl shadow p-8 mb-10 grid grid-cols-2 md:grid-cols-4 gap-6"></div>

        <!-- Active Campaigns -->
        <div class="bg-white rounded-3xl shadow p-8">
            <h2 class="text-2xl font-semibold mb-6">Active Campaigns (<span id="count">0</span>)</h2>
            <div id="list" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
        </div>

        <div class="mt-8 text-center text-xs text-gray-500">
            Last updated: <span id="time"></span>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const res = await fetch('/api/campaign-performance');
                const data = await res.json();
                const campaigns = data.campaigns || [];

                document.getElementById('count').textContent = campaigns.length;
                document.getElementById('time').textContent = new Date().toLocaleString();

                // Summary
                let spend = 0, sales = 0, clicks = 0;
                campaigns.forEach(c => {
                    spend += Number(c.spend || 0);
                    sales += Number(c.sales || 0);
                    clicks += Number(c.clicks || 0);
                });
                const acos = sales > 0 ? ((spend / sales) * 100).toFixed(1) : "0";

                document.getElementById('summary').innerHTML = `
                    <div class="text-center">
                        <div class="text-gray-500">Total Spend</div>
                        <div class="text-3xl font-bold">$${spend.toFixed(2)}</div>
                    </div>
                    <div class="text-center">
                        <div class="text-gray-500">Total Sales</div>
                        <div class="text-3xl font-bold">$${sales.toFixed(2)}</div>
                    </div>
                    <div class="text-center">
                        <div class="text-gray-500">Portfolio ACoS</div>
                        <div class="text-3xl font-bold ${acos < 30 ? 'text-green-600' : acos < 50 ? 'text-amber-600' : 'text-red-600'}">${acos}%</div>
                    </div>
                    <div class="text-center">
                        <div class="text-gray-500">Total Clicks</div>
                        <div class="text-3xl font-bold">${clicks}</div>
                    </div>
                `;

                // Campaigns list
                let html = '';
                campaigns.forEach(c => {
                    const name = c.name || 'Unnamed Campaign';
                    const budget = c.budget && c.budget.budget ? `$${c.budget.budget}` : '—';
                    const acosVal = c.acos !== undefined ? (c.acos * 100).toFixed(1) + '%' : '—';
                    const acosClass = (c.acos || 1) < 0.3 ? 'text-green-600' : (c.acos || 1) < 0.5 ? 'text-amber-600' : 'text-red-600';

                    html += `
                        <div class="card border border-gray-200 rounded-3xl p-6 bg-white">
                            <div class="font-semibold">${name}</div>
                            <div class="text-xs text-gray-500 mt-1">ID: ${c.campaignId || '—'}</div>
                            <div class="mt-6 grid grid-cols-3 gap-4 text-sm">
                                <div><div class="text-gray-500">Budget</div><div>${budget}</div></div>
                                <div><div class="text-gray-500">Spend</div><div>$${Number(c.spend||0).toFixed(2)}</div></div>
                                <div><div class="text-gray-500">Sales</div><div>$${Number(c.sales||0).toFixed(2)}</div></div>
                            </div>
                            <div class="mt-6 grid grid-cols-3 gap-4 text-sm">
                                <div><div class="text-gray-500">Clicks</div><div>${c.clicks||0}</div></div>
                                <div><div class="text-gray-500">Orders</div><div>${c.orders||0}</div></div>
                                <div><div class="text-gray-500">ACoS</div><div class="font-semibold ${acosClass}">${acosVal}</div></div>
                            </div>
                        </div>`;
                });

                if (campaigns.length === 0) {
                    html = `<p class="text-gray-400 p-12 text-center">No active campaigns found.</p>`;
                }
                document.getElementById('list').innerHTML = html;

            } catch (err) {
                console.error(err);
                document.getElementById('list').innerHTML = `<p class="text-red-500 p-12 text-center">Failed to load data.</p>`;
            }
        }

        async function runOptimizer() {
            const token = prompt("Enter DAILY_OPTIMIZER_TOKEN:");
            if (!token) return;
            try {
                const res = await fetch('/api/run-daily-optimization', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ apply_negatives_live: true, apply_winners_live: true, lookback_days: 14 })
                });
                if (res.ok) alert("Optimizer finished!");
                loadDashboard();
            } catch (e) {
                alert("Failed to run optimizer");
            }
        }

        // Load on start and refresh every 2 minutes
        window.onload = loadDashboard;
        setInterval(loadDashboard, 120000);
    </script>
</body>
</html>
