<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Ads Campaign Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-4px); }
        .sparkline { height: 65px; }
        .good { color: #10b981; }
        .warning { color: #f59e0b; }
        .bad { color: #ef4444; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-gray-900">Amazon Ads Campaign Manager</h1>
                <p class="text-gray-600">Natures Way Soil • Real Performance</p>
            </div>
            <button onclick="runOptimizer()" 
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-2xl font-semibold text-lg shadow-lg">
                ▶️ Run Daily Optimizer Now
            </button>
        </div>

        <!-- Portfolio Summary -->
        <div id="portfolio-summary" class="bg-white rounded-3xl shadow p-8 mb-10 grid grid-cols-2 md:grid-cols-4 gap-6"></div>

        <!-- Active Campaigns -->
        <div class="bg-white rounded-3xl shadow p-8">
            <h2 class="text-2xl font-semibold mb-6">Active Campaigns (<span id="active-count">0</span>)</h2>
            <div id="campaigns-list" class="grid grid-cols-1 xl:grid-cols-2 gap-6"></div>
        </div>

        <div class="mt-8 text-center text-xs text-gray-500">
            Last updated: <span id="last-updated"></span>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('/api/campaign-performance');
                const data = await res.json();

                const active = data.campaigns || [];
                document.getElementById('active-count').textContent = active.length;

                renderPortfolioSummary(active);
                renderCampaigns(active);
                document.getElementById('last-updated').textContent = new Date().toLocaleString();
            } catch (e) {
                console.error(e);
                document.getElementById('campaigns-list').innerHTML = 
                    `<p class="text-red-500 p-12 text-center">Failed to load data. Check backend logs.</p>`;
            }
        }

        function renderPortfolioSummary(campaigns) {
            let totalSpend = 0, totalSales = 0, totalClicks = 0;
            campaigns.forEach(c => {
                totalSpend += Number(c.spend || 0);
                totalSales += Number(c.sales || 0);
                totalClicks += Number(c.clicks || 0);
            });

            const portfolioAcos = totalSales > 0 ? ((totalSpend / totalSales) * 100).toFixed(1) : "0";
            const acosClass = portfolioAcos < 30 ? 'good' : portfolioAcos < 50 ? 'warning' : 'bad';

            document.getElementById('portfolio-summary').innerHTML = `
                <div class="text-center">
                    <div class="text-gray-500 text-sm">Total Spend (14d)</div>
                    <div class="text-3xl font-bold">$${totalSpend.toFixed(2)}</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-500 text-sm">Total Sales (14d)</div>
                    <div class="text-3xl font-bold">$${totalSales.toFixed(2)}</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-500 text-sm">Portfolio ACoS</div>
                    <div class="text-3xl font-bold ${acosClass}">${portfolioAcos}%</div>
                </div>
                <div class="text-center">
                    <div class="text-gray-500 text-sm">Total Clicks</div>
                    <div class="text-3xl font-bold">${totalClicks}</div>
                </div>
            `;
        }

        function renderCampaigns(campaigns) {
            const container = document.getElementById('campaigns-list');
            let html = '';

            campaigns.forEach(c => {
                const name = c.name || 'Unnamed Campaign';
                const budget = c.budget && c.budget.budget ? `$${c.budget.budget}` : '—';
                const acos = c.acos !== undefined ? (c.acos * 100).toFixed(1) + '%' : '—';
                const acosClass = (c.acos || 1) < 0.30 ? 'good' : (c.acos || 1) < 0.50 ? 'warning' : 'bad';

                html += `
                    <div class="card border border-gray-200 rounded-3xl p-7 bg-white">
                        <div class="flex justify-between">
                            <div class="font-semibold text-lg">${name}</div>
                            <span class="px-4 py-1 text-xs bg-green-100 text-green-700 rounded-full">ENABLED</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1">ID: ${c.campaignId || '—'}</div>

                        <div class="mt-6 grid grid-cols-3 gap-4 text-sm">
                            <div><div class="text-gray-500">Budget</div><div class="font-medium">${budget}</div></div>
                            <div><div class="text-gray-500">Spend</div><div class="font-medium">$${Number(c.spend||0).toFixed(2)}</div></div>
                            <div><div class="text-gray-500">Sales</div><div class="font-medium">$${Number(c.sales||0).toFixed(2)}</div></div>
                        </div>

                        <div class="mt-6 grid grid-cols-3 gap-4 text-sm">
                            <div><div class="text-gray-500">Clicks</div><div class="font-medium">${c.clicks||0}</div></div>
                            <div><div class="text-gray-500">Orders</div><div class="font-medium">${c.orders||0}</div></div>
                            <div><div class="text-gray-500">ACoS</div><div class="font-semibold ${acosClass}">${acos}</div></div>
                        </div>

                        <div class="mt-6">
                            <div class="text-xs text-gray-500 mb-2">ACoS Trend (14 days)</div>
                            <canvas id="spark-${c.campaignId}" class="sparkline w-full"></canvas>
                        </div>
                    </div>`;
            });

            if (campaigns.length === 0) {
                html = `<p class="text-gray-400 p-12 text-center">No active campaigns found.</p>`;
            }

            container.innerHTML = html;

            // Render sparklines
            setTimeout(() => {
                campaigns.forEach(c => {
                    const canvas = document.getElementById(`spark-${c.campaignId}`);
                    if (canvas && c.daily_trend && c.daily_trend.length > 0) {
                        const trendData = c.daily_trend.map(d => d.acos || 0.4);
                        new Chart(canvas, {
                            type: 'line',
                            data: { labels: Array(trendData.length).fill(''), datasets: [{ data: trendData, borderColor: '#10b981', borderWidth: 2.5, tension: 0.4, pointRadius: 0 }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {display: false}, y: {display: false}} }
                        });
                    }
                });
            }, 200);
        }

        async function runOptimizer() {
            const token = prompt("Enter DAILY_OPTIMIZER_TOKEN:");
            if (!token) return;
            try {
                const res = await fetch('/api/run-daily-optimization', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ apply_negatives_live: true, apply_winners_live: true, lookback_days: 14 })
                });
                if (res.ok) {
                    alert("Optimizer completed!");
                    fetchData();
                } else {
                    alert("Failed to run optimizer");
                }
            } catch (e) {
                alert("Error running optimizer");
            }
        }

        window.onload = fetchData;
        setInterval(fetchData, 180000);
    </script>
</body>
</html>
