<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon PPC Optimizer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .card { transition: all 0.3s; }
        .card:hover { transform: translateY(-4px); }
        .run-btn {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-gray-900">Amazon PPC Optimizer</h1>
                <p class="text-gray-600 mt-1">Natures Way Soil • Live Dashboard</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="runOptimizer()" 
                        class="run-btn bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-2xl font-semibold text-lg shadow-lg flex items-center gap-3 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M5 12h14" />
                    </svg>
                    Run Optimizer Now
                </button>
                <span id="last-updated" class="text-sm text-gray-500"></span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10" id="stats"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Active Campaigns -->
            <div class="lg:col-span-2 bg-white rounded-3xl shadow p-6 card">
                <h2 class="text-2xl font-semibold mb-6 flex items-center gap-2">
                    <span class="text-green-500">●</span>
                    Active Campaigns
                </h2>
                <div id="campaigns-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- Optimizer Performance Chart -->
            <div class="bg-white rounded-3xl shadow p-6 card">
                <h2 class="text-2xl font-semibold mb-4">Recent Optimizer Performance</h2>
                <canvas id="performanceChart" height="260"></canvas>
            </div>
        </div>

        <!-- Recent Optimizer Runs -->
        <div class="mt-10 bg-white rounded-3xl shadow p-6 card">
            <h2 class="text-2xl font-semibold mb-6">Optimizer Run History</h2>
            <div id="history-list" class="space-y-6"></div>
        </div>
    </div>

    <script>
        let performanceChart = null;

        async function fetchData() {
            try {
                const [campaignsRes, historyRes] = await Promise.all([
                    fetch('/api/campaigns'),
                    fetch('/api/optimizer-history')
                ]);

                const campaignsData = await campaignsRes.json();
                const historyData = await historyRes.json();

                renderStats(campaignsData);
                renderCampaigns(campaignsData);
                renderHistory(historyData.history || []);
                renderChart(historyData.history || []);

                document.getElementById('last-updated').textContent = 
                    `Last updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            } catch (err) {
                console.error("Failed to fetch data:", err);
                document.getElementById('campaigns-list').innerHTML = 
                    `<p class="text-red-500 p-4">Error loading data. Backend may be restarting.</p>`;
            }
        }

        function renderStats(data) {
            const html = `
                <div class="bg-white p-6 rounded-2xl shadow border border-gray-100">
                    <p class="text-gray-500 text-sm">Active Campaigns</p>
                    <p class="text-5xl font-bold text-gray-900">${data.count || 0}</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-gray-100">
                    <p class="text-gray-500 text-sm">Last Winners Added</p>
                    <p class="text-5xl font-bold text-emerald-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-gray-100">
                    <p class="text-gray-500 text-sm">Last Negatives Added</p>
                    <p class="text-5xl font-bold text-amber-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow border border-gray-100">
                    <p class="text-gray-500 text-sm">Avg ACOS Target</p>
                    <p class="text-5xl font-bold text-blue-600">≤ 35%</p>
                </div>
            `;
            document.getElementById('stats').innerHTML = html;
        }

        function renderCampaigns(data) {
            const container = document.getElementById('campaigns-list');
            let html = '';
            (data.campaigns || []).forEach(c => {
                html += `
                    <div class="border border-gray-200 rounded-2xl p-5 bg-white">
                        <div class="font-semibold text-lg leading-tight">${c.name || 'Unnamed Campaign'}</div>
                        <div class="text-xs text-gray-500 mt-2 font-mono">${c.campaignId || '—'}</div>
                        <div class="mt-4 flex justify-between text-sm">
                            <span class="text-gray-500">Budget</span>
                            <span class="font-medium">$${c.budget?.budget || '—'}</span>
                        </div>
                    </div>`;
            });
            container.innerHTML = html || '<p class="text-gray-400 col-span-2 p-8 text-center">No active campaigns found.</p>';
        }

        function renderHistory(history) {
            const container = document.getElementById('history-list');
            if (history.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-12">No optimizer runs yet.<br>Click "Run Optimizer Now" to begin.</p>`;
                return;
            }

            let html = '';
            history.slice(0, 10).forEach((run, index) => {
                const time = new Date(run.timestamp).toLocaleString();
                html += `
                    <div class="flex items-start gap-6 p-5 bg-gray-50 rounded-2xl border border-gray-100">
                        <div class="flex-1">
                            <div class="text-xs text-gray-500">${time}</div>
                            <div class="font-medium mt-1">${run.rows_analyzed} search terms analyzed</div>
                        </div>
                        <div class="text-right space-y-1">
                            <div class="text-emerald-600 font-semibold">+${run.winners_applied} Winners</div>
                            <div class="text-amber-600">-${run.negatives_applied} Negatives</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function renderChart(history) {
            const ctx = document.getElementById('performanceChart');
            if (performanceChart) performanceChart.destroy();

            const labels = history.slice(0, 8).map(h => new Date(h.timestamp).toLocaleDateString([], {month:'short', day:'numeric'}));
            const winnersData = history.slice(0, 8).map(h => h.winners_applied || 0);
            const negativesData = history.slice(0, 8).map(h => h.negatives_applied || 0);

            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.length ? labels : ['No data yet'],
                    datasets: [
                        {
                            label: 'Winners Added',
                            data: winnersData,
                            backgroundColor: '#10b981',
                            borderRadius: 6,
                        },
                        {
                            label: 'Negatives Added',
                            data: negativesData,
                            backgroundColor: '#f59e0b',
                            borderRadius: 6,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index' }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        async function runOptimizer() {
            const button = document.querySelector('button[onclick="runOptimizer()"]');
            const originalText = button.innerHTML;

            button.disabled = true;
            button.innerHTML = `
                <svg class="animate-spin h-6 w-6 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Running Optimizer...
            `;

            try {
                const res = await fetch('/api/run-daily-optimization', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + prompt("Enter your DAILY_OPTIMIZER_TOKEN:", "")
                    },
                    body: JSON.stringify({
                        apply_negatives_live: true,
                        apply_winners_live: true,
                        winner_bid: 0.90,
                        lookback_days: 14
                    })
                });

                if (!res.ok) throw new Error("Failed to run optimizer");

                const result = await res.json();
                alert(`✅ Optimizer completed successfully!\n\n` +
                      `Winners Found: ${result.winners}\n` +
                      `Negatives Found: ${result.negatives}\n` +
                      `Winners Applied: ${result.winners_applied?.length || 0}\n` +
                      `Negatives Applied: ${result.negatives_applied?.length || 0}`);

                // Refresh dashboard
                await fetchData();
            } catch (err) {
                alert("❌ Failed to run optimizer.\nMake sure your DAILY_OPTIMIZER_TOKEN is correct.");
                console.error(err);
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }

        // Auto refresh every 90 seconds
        window.onload = fetchData;
        setInterval(fetchData, 90000);
    </script>
</body>
</html>
