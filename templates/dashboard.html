<!DOCTYPE html>
<html>
<head>
  <title>Amazon Ads Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container">
    <h1>Amazon Ads Campaign Manager</h1>
    
    <div class="optimizer-status">
      <h2>Daily Optimizer Status</h2>
      <div id="optimizerStatus">Loading optimizer info...</div>
    </div>
    
    <h2>Active Campaigns (<span id="campaignCount">0</span>)</h2>
    <p style="color: #666; font-size: 14px;">Showing only ENABLED campaigns</p>
    <div id="campaignsLoading">Loading campaigns...</div>
    <table id="campaignsTable" style="display:none;">
      <thead>
        <tr>
          <th>Campaign ID</th>
          <th>Name</th>
          <th>State</th>
          <th>Budget</th>
          <th>Start Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    
    <h2>Products (<span id="productCount">0</span>)</h2>
    <table id="productsTable">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Title</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    
    <h2>Keywords</h2>
    <div id="keywords"></div>
    
    <h2>Campaign Output</h2>
    <pre id="output"></pre>
  </div>

<script>
async function loadOptimizerStatus() {
  try {
    const res = await fetch('/api/optimizer-status');
    const data = await res.json();
    
    const html = `
      <div class="optimizer-card">
        <div class="optimizer-header">
          <span class="status-badge">Active</span>
          <strong>${data.description}</strong>
        </div>
        <p><strong>Schedule:</strong> ${data.schedule}</p>
        <p><strong>Analysis Period:</strong> Last ${data.lookback_days} days of search term data</p>
        
        <h3>What it does:</h3>
        
        <div class="action-card winner">
          <h4>✅ Promotes Winners</h4>
          <p><strong>Criteria:</strong> ${data.actions.winners.criteria}</p>
          <p><strong>Action:</strong> ${data.actions.winners.action}</p>
          <p><strong>Bid:</strong> ${data.actions.winners.bid_amount}</p>
        </div>
        
        <div class="action-card negative">
          <h4>🚫 Blocks Poor Performers</h4>
          <p><strong>Criteria:</strong> ${data.actions.negatives.criteria}</p>
          <p><strong>Action:</strong> ${data.actions.negatives.action}</p>
        </div>
        
        <div class="action-card hold">
          <h4>👀 Monitors Middle Performers</h4>
          <p><strong>Criteria:</strong> ${data.actions.hold.criteria}</p>
          <p><strong>Action:</strong> ${data.actions.hold.action}</p>
        </div>
        
        <p class="note"><strong>Note:</strong> ${data.note}</p>
      </div>
    `;
    
    document.getElementById('optimizerStatus').innerHTML = html;
  } catch (err) {
    document.getElementById('optimizerStatus').textContent = 'Error loading optimizer status';
  }
}

async function loadCampaigns() {
  try {
    const res = await fetch('/api/campaigns');
    const data = await res.json();
    
    document.getElementById('campaignsLoading').style.display = 'none';
    document.getElementById('campaignCount').textContent = data.count;
    const table = document.getElementById('campaignsTable');
    table.style.display = 'table';
    
    const tbody = table.querySelector("tbody");
    tbody.innerHTML = "";
    
    data.campaigns.forEach(c => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${c.campaignId || 'N/A'}</td>
        <td>${c.name || 'N/A'}</td>
        <td><span class="state-enabled">${c.state || 'N/A'}</span></td>
        <td>$${c.budget?.budget || 'N/A'} ${c.budget?.budgetType || ''}</td>
        <td>${c.startDate || 'N/A'}</td>
      `;
      tbody.appendChild(row);
    });
    
    if (data.campaigns.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5">No active campaigns found</td></tr>';
    }
  } catch (err) {
    document.getElementById('campaignsLoading').textContent = 'Error loading campaigns: ' + err.message;
  }
}

async function loadProducts() {
  const res = await fetch('/api/products');
  const data = await res.json();
  document.getElementById('productCount').textContent = data.count;
  const tbody = document.querySelector("#productsTable tbody");
  tbody.innerHTML = "";
  
  data.products.forEach(p => {
    const row = document.createElement("tr");
    const tdSku = document.createElement("td");
    tdSku.textContent = p.sku;
    
    const tdTitle = document.createElement("td");
    tdTitle.textContent = p.title;
    
    const tdPrice = document.createElement("td");
    tdPrice.textContent = '$' + p.price;
    
    const tdActions = document.createElement("td");
    const btnKeywords = document.createElement("button");
    btnKeywords.textContent = "Keywords";
    btnKeywords.onclick = () => showKeywords(p.sku);
    
    const btnLaunch = document.createElement("button");
    btnLaunch.textContent = "Launch";
    btnLaunch.onclick = () => launchCampaign(p.sku);
    
    tdActions.appendChild(btnKeywords);
    tdActions.appendChild(btnLaunch);
    
    row.appendChild(tdSku);
    row.appendChild(tdTitle);
    row.appendChild(tdPrice);
    row.appendChild(tdActions);
    
    tbody.appendChild(row);
  });
}

async function showKeywords(sku) {
  const res = await fetch(`/api/generate-keywords/${sku}`);
  const data = await res.json();
  document.getElementById("keywords").innerHTML = 
    `<h3>${data.product.title}</h3><pre>${JSON.stringify(data.keywords, null, 2)}</pre>`;
}

async function launchCampaign(sku) {
  document.getElementById("output").textContent = "Creating campaign...";
  try {
    const res = await fetch('/api/create-campaign-from-product', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({product_id: sku})
    });
    const data = await res.json();
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    
    loadCampaigns();
  } catch (err) {
    document.getElementById("output").textContent = "Error: " + err.message;
  }
}

window.onload = () => {
  loadOptimizerStatus();
  loadCampaigns();
  loadProducts();
};
</script>
</body>
</html>
