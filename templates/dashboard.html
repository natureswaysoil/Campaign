<!DOCTYPE html>
<html>
<head>
  <title>Amazon Ads Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <div class="wrap">
    <h1>🚀 Amazon Ads Dashboard</h1>

    <button onclick="loadProducts()">Load Products</button>

    <table id="productsTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>SKU</th>
          <th>Price</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Keywords</h2>
    <div id="keywords"></div>

    <h2>Campaign Output</h2>
    <pre id="output"></pre>
  </div>

<script>
async function loadProducts() {
  const res = await fetch('/api/products');
  const data = await res.json();

  const tbody = document.querySelector("#productsTable tbody");
  tbody.innerHTML = "";

  data.products.forEach(p => {
    const row = document.createElement("tr");

    const tdTitle = document.createElement("td");
    tdTitle.textContent = p.title;

    const tdSku = document.createElement("td");
    tdSku.textContent = p.sku;

    const tdPrice = document.createElement("td");
    tdPrice.textContent = p.price;

    const btnKeywords = document.createElement("button");
    btnKeywords.textContent = "Keywords";
    btnKeywords.addEventListener("click", () => getKeywords(p.sku));

    const btnLaunch = document.createElement("button");
    btnLaunch.textContent = "Launch";
    btnLaunch.addEventListener("click", () => createCampaign(p.sku));

    const tdActions = document.createElement("td");
    tdActions.appendChild(btnKeywords);
    tdActions.appendChild(btnLaunch);

    row.appendChild(tdTitle);
    row.appendChild(tdSku);
    row.appendChild(tdPrice);
    row.appendChild(tdActions);

    tbody.appendChild(row);
  });
}

async function getKeywords(sku) {
  const res = await fetch(`/api/generate-keywords/${encodeURIComponent(sku)}`);
  const data = await res.json();

  const box = document.getElementById("keywords");
  box.innerHTML = "";

  data.keywords.forEach(k => {
    const span = document.createElement("span");
    span.className = "chip";
    span.textContent = k;
    box.appendChild(span);
  });
}

async function createCampaign(sku) {
  const output = document.getElementById("output");
  output.textContent = "Launching campaign...";

  try {
    const res = await fetch('/api/create-campaign-from-product', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sku })
    });

    const data = await res.json();
    output.textContent = JSON.stringify(data, null, 2);

    if (!res.ok) {
      alert("Launch failed: " + (data.detail || "Unknown error"));
      return;
    }

    alert("Launch completed");
  } catch (err) {
    output.textContent = String(err);
    alert("Launch error: " + err);
  }
}
</script>

</body>
</html>
