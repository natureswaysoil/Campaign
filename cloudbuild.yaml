steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/amazon-ads-autopilot/app:$BUILD_ID', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/amazon-ads-autopilot/app:latest', '.']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/amazon-ads-autopilot/app']
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - amazon-ads-autopilot
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/amazon-ads-autopilot/app:latest
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/amazon-ads-autopilot/app:latest'
